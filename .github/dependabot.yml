version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
    assignees:
      - kwent
    labels:
      - dependencies
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
    assignees:
      - kwent
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
    assignees:
      - kwent
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 7
